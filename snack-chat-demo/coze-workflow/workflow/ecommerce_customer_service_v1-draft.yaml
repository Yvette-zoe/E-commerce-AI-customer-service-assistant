    - id: "124727"
      type: intent
      title: 意图识别
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Intent-v2.jpg
      description: "用于用户输入的意图识别，并将其与预设意图选项进行匹配。"
      position:
        x: 640
        y: 755.4499999999999
      parameters:
        chatHistorySetting:
            chatHistoryRound: 3
            enableChatHistory: false
        intents:
            - name: 闲聊
            - name: 查询订单/物流状态
            - name: 退换货等售后处理
            - name: 商品、店铺相关政策
            - name: 发票优惠券
            - name: 商品咨询
            - name: 投诉
        llmParam:
            chatHistoryRound: 3
            enableChatHistory: false
            frequencyPenalty: 0
            generationDiversity: default_val
            maxTokens: 4096
            modelName: 豆包·2.0·pro
            modelType: 1.772700462e+09
            parameters:
                max_completion_tokens: 0
                reasoning_effort: medium
            prompt:
                type: string
                value:
                    content: '{{query}}'
                    type: literal
            responseFormat: 2
            systemPrompt:
                type: string
                value:
                    content: |-
                        你是一个专业的电商售后意图识别引擎。你的唯一任务是分析用户的输入，并将其精准分类到预定义的意图标签中。

                        ### 预定义意图标签（Labels）：

                        - ORDER_QUERY: 查询物流状态、催发货、修改收货地址/电话、拒收快递。
                        - REFUND_AFTER_SALES: 申请退款、退货、换货、询问退换货政策、运费谁承担、退款进度。
                        - PRODUCT_ISSUE: 商品破损、质量问题、错发/漏发、不会使用/需要指导、保修维修。
                        - ORDER_PAYMENT: 取消订单、修改订单信息、发票开具、支付失败、优惠券/满减售后问题。
                        - COMPLAINT_URGENT: 情绪极度激动、要求赔偿、提及投诉/315/媒体曝光、明确要求转人工。
                        - GENERAL_CHAT: 打招呼（你好/在吗）、闲聊、表达感谢、无法识别的无效输入。
                        - PRODUCT_CONSULT：咨询商品口味、保质期等相关问题。
                        - UNKNOWN：其他无法判定难以判定或置信度较低的情况。

                        ### 输出规则：

                        1. 必须且仅输出一个合法的JSON对象，不要包含任何Markdown格式（如 ```json），不要包含任何解释性文字。
                        2. JSON格式必须严格为：{"intent": "标签名称", "confidence": 0.95, "summary": "一句话概括用户核心诉求"}
                        3. 如果用户包含多个意图，请提取当前最紧急、最需要立即处理的意图作为主意图，并在summary中简要提及次要诉求。
                        4. 如果用户情绪激动或明确提出“转人工”，必须优先分类为 COMPLAINT_URGENT。
                        5. confidence 字段表示你对该分类的置信度（0.0 - 1.0）。

                        ### 示例：

                        User: "我的快递怎么三天了还在中转站？"
                        Assistant: {"intent": "LOGISTICS_QUERY", "confidence": 0.99, "summary": "查询物流停滞原因"}

                        User: "收到的杯子碎了，我要退款，还有你们这什么质量啊！"
                        Assistant: {"intent": "PRODUCT_ISSUE", "confidence": 0.95, "summary": "商品破损要求退款，伴随质量投诉"}

                        User: "你好，在吗？"
                        Assistant: {"intent": "GENERAL_CHAT", "confidence": 0.99, "summary": "用户打招呼"}

                        User: "帮我改下地址，另外发票什么时候能开？"
                        Assistant: {"intent": "LOGISTICS_QUERY", "confidence": 0.90, "summary": "修改收货地址，附带询问发票开具"}
                    type: literal
            thinkingType: disabled
        mode: all
        node_inputs:
            - name: query
